name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check prerequisites
        run: |
          missing=0
          for cmd in git jq; do
            if command -v "$cmd" > /dev/null; then
              echo "found $cmd"
            else
              echo "::error::required command '$cmd' is not available"
              missing=1
            fi
          done
          exit $missing

      - name: Syntax check
        run: |
          for f in uninstall-legacy.sh hooks/*.sh scripts/*.sh tests/test-*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            jq empty "$f" && echo "ok  $f"
          done

      - name: Run tests
        run: |
          rc=0
          for t in tests/test-*.sh; do
            echo "::group::$t"
            bash "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc
